<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750A4">
  <meta name="description" content="Haqdar helps gig and daily-wage workers understand pay, rights, and benefits in their own language.">
  <title>Haqdar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=block">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip"></a>
  <div class="atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="top-bar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">ह</span>
      <span class="brand__text">
        <span class="brand__name">Haqdar</span>
        <span class="brand__tagline" data-i18n="tagline"></span>
      </span>
    </div>
    <button id="lang-button" class="btn btn--tonal btn--sm" type="button" aria-haspopup="dialog" aria-controls="lang-dialog">
      <span class="icon" aria-hidden="true">translate</span>
      <span id="lang-current">English</span>
      <span class="visually-hidden" data-i18n="lang_button"></span>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <!-- Co-pilot: Saathi answers calls while the rider rides and briefs them at the next stop. -->
    <section id="view-copilot" class="view" aria-labelledby="cp-title" data-view="copilot" hidden>
      <div class="hero hero--copilot">
        <div id="cp-avatar" class="avatar" data-state="idle"></div>
        <h1 id="cp-title" data-i18n="cp_title"></h1>
        <p class="cp-hint" data-i18n="cp_hint"></p>
        <p id="cp-status" class="cp-status" role="status" aria-live="polite"></p>
        <div class="hero__actions">
          <button id="cp-toggle" class="btn btn--filled btn--large" type="button" aria-pressed="false"></button>
          <button id="cp-talk" class="btn btn--tertiary btn--large" type="button" aria-pressed="false">
            <span class="icon" aria-hidden="true">mic</span><span id="cp-talk-label" data-i18n="cp_talk"></span>
          </button>
        </div>
        <p id="cp-listening" class="banner banner--info" role="status" hidden>
          <span class="icon" aria-hidden="true">graphic_eq</span><span data-i18n="cp_listening"></span>
        </p>
        <p id="cp-reply" class="result__transcript" aria-live="polite" hidden></p>
        <form id="cp-ask-form" class="compose" autocomplete="off">
          <div class="field">
            <label for="cp-ask-text" data-i18n="cp_type_label"></label>
            <input id="cp-ask-text" class="field__control" type="text" maxlength="500" enterkeyhint="send">
          </div>
          <button class="btn btn--filled btn--icon" type="submit" data-i18n-aria="ask_send"><span class="icon" aria-hidden="true">send</span></button>
        </form>
      </div>

      <section class="card stack" aria-labelledby="cp-calls-title">
        <div class="card__head">
          <h2 id="cp-calls-title" data-i18n="cp_calls_title"></h2>
          <span id="cp-new" class="verdict verdict--low" hidden></span>
        </div>
        <ul id="cp-list" class="call-list"></ul>
        <button id="cp-play" class="btn btn--tonal" type="button"><span class="icon" aria-hidden="true">play_circle</span><span data-i18n="cp_play"></span></button>
      </section>

      <form id="cp-order-form" class="card stack" novalidate>
        <div>
          <h2 data-i18n="cp_order_title"></h2>
          <p class="card__hint" data-i18n="cp_order_hint"></p>
        </div>
        <div class="grid-2">
          <div class="field"><label for="cp-name" data-i18n="f_name"></label><input id="cp-name" name="riderName" class="field__control" type="text" maxlength="40" autocomplete="given-name"></div>
          <div class="field"><label for="cp-platform" data-i18n="f_platform"></label><input id="cp-platform" name="platform" class="field__control" type="text" maxlength="40"></div>
          <div class="field"><label for="cp-area" data-i18n="f_area"></label><input id="cp-area" name="customerArea" class="field__control" type="text" maxlength="80"></div>
          <div class="field"><label for="cp-eta" data-i18n="f_eta"></label><input id="cp-eta" name="etaMinutes" class="field__control" type="number" inputmode="numeric" min="0" max="240"></div>
        </div>
        <div class="row">
          <button class="btn btn--filled" type="submit"><span class="icon" aria-hidden="true">save</span><span data-i18n="cp_save"></span></button>
          <button id="cp-delivered" class="btn btn--outlined" type="button"><span class="icon" aria-hidden="true">task_alt</span><span data-i18n="cp_delivered"></span></button>
        </div>
      </form>

      <section class="card stack" aria-labelledby="cp-setup-title">
        <h2 id="cp-setup-title" data-i18n="cp_setup_title"></h2>
        <p class="card__hint" data-i18n="cp_setup_hint"></p>
        <div class="chips" lang="en">
          <a class="chip" href="tel:**61*+918031450668%23"><span class="icon" aria-hidden="true">dialpad</span>**61*+918031450668#</a>
          <a class="chip" href="tel:**67*+918031450668%23"><span class="icon" aria-hidden="true">dialpad</span>**67*+918031450668#</a>
        </div>
        <p class="field__help" data-i18n="cp_setup_off"></p>
        <p data-i18n="cp_setup_test"></p>
        <a class="btn btn--outlined" href="tel:+918031450668"><span class="icon" aria-hidden="true">call</span>+91 80314 50668</a>
      </section>
    </section>

    <!-- Ask: the home screen. Photo, voice, or text in. Explanation and next steps out. -->
    <section id="view-ask" class="view" aria-labelledby="ask-title" data-view="ask" hidden>
      <div class="hero">
        <h1 id="ask-title" data-i18n="ask_title"></h1>
        <p data-i18n="ask_hint"></p>
        <div class="hero__actions">
          <label class="btn btn--filled btn--large" for="ask-photo-input">
            <span class="icon" aria-hidden="true">photo_camera</span>
            <span data-i18n="ask_photo"></span>
          </label>
          <input id="ask-photo-input" class="visually-hidden" type="file" accept="image/*" capture="environment">
          <button id="ask-mic" class="btn btn--tertiary btn--large" type="button" aria-pressed="false">
            <span class="icon" aria-hidden="true">mic</span>
            <span id="ask-mic-label" data-i18n="ask_speak"></span>
          </button>
        </div>
        <p id="ask-recording" class="banner banner--info" role="status" hidden>
          <span class="icon" aria-hidden="true">graphic_eq</span><span data-i18n="ask_recording"></span>
        </p>
        <form id="ask-form" class="compose" autocomplete="off">
          <div class="field">
            <label for="ask-text" data-i18n="ask_type_label"></label>
            <input id="ask-text" class="field__control" type="text" maxlength="2000" enterkeyhint="send">
          </div>
          <button class="btn btn--filled btn--icon" type="submit" data-i18n-aria="ask_send">
            <span class="icon" aria-hidden="true">send</span>
          </button>
        </form>
      </div>

      <div class="stack stack--tight" id="ask-examples">
        <p class="card__section-title" data-i18n="ask_try"></p>
        <div class="chips">
          <button class="chip" type="button" data-example="ex_1"><span class="icon" aria-hidden="true">payments</span><span data-i18n="ex_1"></span></button>
          <button class="chip" type="button" data-example="ex_2"><span class="icon" aria-hidden="true">shield</span><span data-i18n="ex_2"></span></button>
          <button class="chip" type="button" data-example="ex_3"><span class="icon" aria-hidden="true">badge</span><span data-i18n="ex_3"></span></button>
        </div>
      </div>

      <div id="ask-result" class="result" tabindex="-1" aria-live="polite"></div>
    </section>

    <!-- Earnings: log a day, check fair pay, see the week. -->
    <section id="view-earnings" class="view" aria-labelledby="earn-title" data-view="earnings" hidden>
      <form id="earn-form" class="card stack" novalidate>
        <div>
          <h1 id="earn-title" data-i18n="earn_title"></h1>
          <p class="card__hint" data-i18n="earn_hint"></p>
        </div>
        <div class="grid-2">
          <div class="field"><label for="earn-earnings" data-i18n="f_earnings"></label><input id="earn-earnings" name="earnings" class="field__control" type="number" inputmode="decimal" min="0" step="any" required></div>
          <div class="field"><label for="earn-hours" data-i18n="f_hours"></label><input id="earn-hours" name="hours" class="field__control" type="number" inputmode="decimal" min="0.25" max="24" step="any" required></div>
          <div class="field"><label for="earn-fuel" data-i18n="f_fuel"></label><input id="earn-fuel" name="fuel" class="field__control" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
          <div class="field"><label for="earn-other" data-i18n="f_other"></label><input id="earn-other" name="other" class="field__control" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
          <div class="field"><label for="earn-platform" data-i18n="f_platform"></label><input id="earn-platform" name="platform" class="field__control" type="text" maxlength="60"></div>
          <div class="field"><label for="earn-date" data-i18n="f_date"></label><input id="earn-date" name="date" class="field__control" type="date" required></div>
          <div class="field"><label for="earn-state" data-i18n="f_state"></label><select id="earn-state" name="state" class="field__control" data-states required></select></div>
          <div class="field"><label for="earn-work" data-i18n="f_work"></label><select id="earn-work" name="workType" class="field__control" data-work-types></select></div>
        </div>
        <button class="btn btn--filled btn--block" type="submit">
          <span class="icon" aria-hidden="true">balance</span><span data-i18n="earn_save"></span>
        </button>
      </form>

      <div id="earn-result" class="result" tabindex="-1" aria-live="polite"></div>

      <section class="card stack" aria-labelledby="week-title">
        <h2 id="week-title" data-i18n="week_title"></h2>
        <div id="week-summary"></div>
      </section>
    </section>

    <!-- Benefits: schemes and laws that fit the worker. -->
    <section id="view-benefits" class="view" aria-labelledby="ben-title" data-view="benefits" hidden>
      <form id="ben-form" class="card stack" novalidate>
        <div>
          <h1 id="ben-title" data-i18n="ben_title"></h1>
          <p class="card__hint" data-i18n="ben_hint"></p>
        </div>
        <div class="grid-2">
          <div class="field"><label for="ben-state" data-i18n="f_state"></label><select id="ben-state" name="state" class="field__control" data-states required></select></div>
          <div class="field"><label for="ben-work" data-i18n="f_work"></label><select id="ben-work" name="workType" class="field__control" data-work-types></select></div>
          <div class="field"><label for="ben-age" data-i18n="f_age"></label><input id="ben-age" name="age" class="field__control" type="number" inputmode="numeric" min="14" max="100" required></div>
          <div class="field">
            <label for="ben-income" data-i18n="f_income"></label>
            <input id="ben-income" name="monthlyIncome" class="field__control" type="number" inputmode="numeric" min="0" required aria-describedby="ben-income-help">
            <p id="ben-income-help" class="field__help" data-i18n="ben_from_log" hidden></p>
          </div>
        </div>
        <button class="btn btn--filled btn--block" type="submit">
          <span class="icon" aria-hidden="true">volunteer_activism</span><span data-i18n="ben_submit"></span>
        </button>
      </form>

      <div id="ben-result" class="result stack" tabindex="-1" aria-live="polite"></div>

      <section class="card stack" aria-labelledby="help-title">
        <h2 id="help-title" data-i18n="help_title"></h2>
        <div id="helplines" class="chips"></div>
      </section>
    </section>

    <!-- Complaint: a formal letter from a description or a screenshot. -->
    <section id="view-complaint" class="view" aria-labelledby="cmp-title" data-view="complaint" hidden>
      <form id="cmp-form" class="card stack" novalidate>
        <div>
          <h1 id="cmp-title" data-i18n="cmp_title"></h1>
          <p class="card__hint" data-i18n="cmp_hint"></p>
        </div>
        <div class="field"><label for="cmp-problem" data-i18n="f_problem"></label><textarea id="cmp-problem" name="problem" class="field__control" maxlength="2000"></textarea></div>
        <div class="grid-2">
          <div class="field"><label for="cmp-platform" data-i18n="f_platform"></label><input id="cmp-platform" name="platform" class="field__control" type="text" maxlength="60"></div>
          <div class="field"><label for="cmp-city" data-i18n="f_city"></label><input id="cmp-city" name="city" class="field__control" type="text" maxlength="60"></div>
        </div>
        <div class="row">
          <label class="btn btn--outlined" for="cmp-photo-input">
            <span class="icon" aria-hidden="true">add_photo_alternate</span><span data-i18n="cmp_photo"></span>
          </label>
          <input id="cmp-photo-input" class="visually-hidden" type="file" accept="image/*">
          <div id="cmp-photo-preview" class="photo-preview" hidden></div>
        </div>
        <button class="btn btn--filled btn--block" type="submit">
          <span class="icon" aria-hidden="true">edit_document</span><span data-i18n="cmp_submit"></span>
        </button>
      </form>

      <div id="cmp-result" class="result stack" tabindex="-1" aria-live="polite"></div>
    </section>
  </main>

  <p class="footer-note" data-i18n="footer"></p>

  <nav class="nav-bar" aria-label="Main">
    <a class="nav-item" href="#copilot" data-nav="copilot"><span class="nav-item__pill"><span class="icon" aria-hidden="true">support_agent</span></span><span data-i18n="nav_copilot"></span></a>
    <a class="nav-item" href="#ask" data-nav="ask"><span class="nav-item__pill"><span class="icon" aria-hidden="true">auto_awesome</span></span><span data-i18n="nav_ask"></span></a>
    <a class="nav-item" href="#earnings" data-nav="earnings"><span class="nav-item__pill"><span class="icon" aria-hidden="true">payments</span></span><span data-i18n="nav_earnings"></span></a>
    <a class="nav-item" href="#benefits" data-nav="benefits"><span class="nav-item__pill"><span class="icon" aria-hidden="true">volunteer_activism</span></span><span data-i18n="nav_benefits"></span></a>
    <a class="nav-item" href="#complaint" data-nav="complaint"><span class="nav-item__pill"><span class="icon" aria-hidden="true">campaign</span></span><span data-i18n="nav_complaint"></span></a>
  </nav>

  <dialog id="lang-dialog" aria-labelledby="lang-title" aria-describedby="lang-hint">
    <div class="card__head">
      <div>
        <h2 id="lang-title" data-i18n="lang_title"></h2>
        <p id="lang-hint" class="card__hint" data-i18n="lang_hint"></p>
      </div>
      <button id="lang-close" class="btn btn--text btn--icon" type="button" data-i18n-aria="close"><span class="icon" aria-hidden="true">close</span></button>
    </div>
    <div id="lang-options" class="lang-grid" role="radiogroup" aria-labelledby="lang-title"></div>
  </dialog>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
</body>
</html>
